{% extends 'base.html' %}
{% load static %}

{% block title %}Random Team Generator - TEAMSUFFER{% endblock %}

{% block content %}
<style>
    .rtg-wrapper {
        min-height: 100vh;
        background: linear-gradient(135deg, #0f1223 0%, #1a1a2e 100%);
        color: #fff;
        padding: 40px 20px;
        position: relative;
        overflow: hidden;
    }

    .rtg-bg-blob {
        position: absolute;
        width: 50vw;
        height: 50vw;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.15;
        z-index: 0;
        pointer-events: none;
    }

    .blob-1 {
        top: -10%;
        left: -10%;
        background: #9d4edd;
        animation: pulseBlob 8s infinite alternate;
    }

    .blob-2 {
        bottom: -10%;
        right: -10%;
        background: #4361ee;
        animation: pulseBlob 8s infinite alternate-reverse;
    }

    @keyframes pulseBlob {
        0% {
            transform: scale(1);
            opacity: 0.15;
        }

        100% {
            transform: scale(1.1);
            opacity: 0.25;
        }
    }

    .rtg-container {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
    }

    @media (max-width: 992px) {
        .rtg-container {
            grid-template-columns: 1fr;
        }
    }

    .rtg-card {
        background: rgba(30, 35, 50, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .rtg-title {
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 10px;
        background: linear-gradient(90deg, #4cc9f0, #7209b7);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: inline-block;
    }

    .rtg-subtitle {
        color: #a0a0b0;
        margin-bottom: 30px;
        font-size: 0.95rem;
    }

    .rtg-input-group label {
        display: block;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #ccc;
        margin-bottom: 8px;
        font-weight: 600;
    }

    .rtg-textarea {
        width: 100%;
        background: rgba(10, 12, 20, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 15px;
        color: #fff;
        font-family: inherit;
        resize: none;
        transition: border-color 0.3s;
    }

    .rtg-textarea:focus {
        outline: none;
        border-color: #4361ee;
        box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }

    .rtg-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
    }

    .rtg-select,
    .rtg-number {
        width: 100%;
        background: rgba(10, 12, 20, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 12px;
        color: #fff;
    }

    .btn-generate {
        width: 100%;
        background: linear-gradient(90deg, #4361ee, #f72585);
        border: none;
        padding: 16px;
        border-radius: 14px;
        color: white;
        font-weight: 700;
        font-size: 1.1rem;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 15px rgba(247, 37, 133, 0.4);
    }

    .btn-generate:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(247, 37, 133, 0.6);
    }

    .btn-generate:active {
        transform: translateY(0);
    }

    /* Results Area */
    .rtg-results-area {
        position: relative;
        min-height: 400px;
        max-height: 700px;
        overflow-y: auto;
        padding-right: 10px;
    }

    /* Scrollbar */
    .rtg-results-area::-webkit-scrollbar {
        width: 6px;
    }

    .rtg-results-area::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
    }

    .rtg-results-area::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
    }

    .rtg-empty-state {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #555;
        border: 2px dashed rgba(255, 255, 255, 0.1);
        border-radius: 20px;
    }

    .team-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 20px;
    }

    .team-card {
        background: rgba(40, 45, 60, 0.7);
        border-radius: 12px;
        padding: 20px;
        border-left: 4px solid #4361ee;
        animation: slideIn 0.4s ease-out forwards;
        opacity: 0;
        transform: translateY(20px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    @keyframes slideIn {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .team-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .team-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #fff;
    }

    .team-count {
        font-size: 0.75rem;
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 8px;
        border-radius: 4px;
        color: #aaa;
    }

    .team-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .team-member {
        display: flex;
        align-items: center;
        padding: 6px 0;
        color: #ddd;
        font-size: 0.95rem;
    }

    .team-member::before {
        content: '';
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #555;
        border-radius: 50%;
        margin-right: 10px;
    }

    /* Utilities */
    .hidden {
        display: none !important;
    }
</style>

<div class="rtg-wrapper">
    <div class="rtg-bg-blob blob-1"></div>
    <div class="rtg-bg-blob blob-2"></div>

    <div class="rtg-container">

        <!-- Controls -->
        <div class="rtg-card">
            <h1 class="rtg-title"><i class="fas fa-random me-2"></i>Random Teams</h1>
            <p class="rtg-subtitle">ระบบสุ่มทีมแฟร์ๆ เหมือน Challonge</p>

            <div class="rtg-input-group" style="margin-bottom: 20px;">
                <label>รายชื่อผู้เล่น (คนละบรรทัด)</label>
                <textarea id="playerNames" class="rtg-textarea" rows="10"
                    placeholder="ตัวอย่าง:&#10;Player 1&#10;Player 2&#10;Player 3"></textarea>
                <div style="text-align: right; font-size: 0.8rem; color: #666; margin-top: 5px;">
                    <span id="playerCount">0</span> changes
                </div>
            </div>

            <div class="rtg-controls">
                <div class="rtg-input-group">
                    <label>วิธีการแบ่ง</label>
                    <select id="splitMethod" class="rtg-select">
                        <option value="numTeams">จำนวนทีมที่ต้องการ</option>
                        <option value="perTeam">จำนวนคนต่อทีม</option>
                    </select>
                </div>
                <div class="rtg-input-group">
                    <label id="countLabel">จำนวน</label>
                    <input type="number" id="splitCount" class="rtg-number" value="2" min="1">
                </div>
            </div>

            <button onclick="generateTeams()" class="btn-generate">
                <i class="fas fa-magic me-2"></i> สุ่มทีมเลย
            </button>
        </div>

        <!-- Output -->
        <div class="rtg-results-area">
            <div id="emptyState" class="rtg-empty-state">
                <i class="fas fa-users" style="font-size: 4rem; margin-bottom: 20px; opacity: 0.3;"></i>
                <p>รายชื่อทีมจะปรากฏที่นี่</p>
            </div>

            <div id="resultsGrid" class="team-grid hidden"></div>
        </div>

    </div>
</div>

<script>
    const playerInput = document.getElementById('playerNames');
    const countDisplay = document.getElementById('playerCount');

    playerInput.addEventListener('input', () => {
        const names = playerInput.value.trim().split('\n').filter(n => n.trim());
        countDisplay.textContent = names.length + ' คน';
    });

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function generateTeams() {
        const text = playerInput.value;
        const rawNames = text.split('\n').map(x => x.trim()).filter(x => x.length > 0);

        if (rawNames.length < 2) {
            alert('กรุณากรอกชื่อผู้เล่นอย่างน้อย 2 คน');
            return;
        }

        let players = [...rawNames];
        shuffleArray(players);

        const method = document.getElementById('splitMethod').value;
        const count = parseInt(document.getElementById('splitCount').value) || 2;

        let chunkedTeams = [];

        if (method === 'numTeams') {
            const numTeams = Math.max(1, count);
            chunkedTeams = Array.from({ length: numTeams }, () => []);
            players.forEach((player, index) => {
                chunkedTeams[index % numTeams].push(player);
            });
        } else {
            // Per Team
            const size = Math.max(1, count);
            for (let i = 0; i < players.length; i += size) {
                chunkedTeams.push(players.slice(i, i + size));
            }
        }

        renderTeams(chunkedTeams);
    }

    function renderTeams(teams) {
        const grid = document.getElementById('resultsGrid');
        const empty = document.getElementById('emptyState');

        empty.classList.add('hidden');
        grid.classList.remove('hidden');
        grid.innerHTML = '';

        const colors = ['#f72585', '#4cc9f0', '#7209b7', '#4361ee', '#4895ef'];

        teams.forEach((members, index) => {
            const color = colors[index % colors.length];
            const div = document.createElement('div');
            div.className = 'team-card';
            div.style.borderLeftColor = color;
            div.style.animationDelay = (index * 0.1) + 's';

            let html = `
                <div class="team-header">
                    <span class="team-title" style="color:${color}">Team ${index + 1}</span>
                    <span class="team-count"><i class="fas fa-user mb-1"></i> ${members.length}</span>
                </div>
                <ul class="team-list">
            `;

            members.forEach(m => {
                html += `<li class="team-member">${m}</li>`;
            });

            html += `</ul>`;
            div.innerHTML = html;
            grid.appendChild(div);
        });
    }
</script>
{% endblock %}
